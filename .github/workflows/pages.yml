name: Test and deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js data _site/
      - name: Stamp file links with the commit so browsers fetch fresh copies
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -e "s#css/site.css\"#css/site.css?v=$V\"#" -e "s#js/main.js\"#js/main.js?v=$V\"#" _site/index.html
          sed -i -E "s#from '\./([a-z]+)\.js'#from './\1.js?v=$V'#g" _site/js/*.js
          sed -i "s#fetch(u)#fetch(u + '?v=$V')#" _site/js/main.js
          grep -c "v=$V" _site/index.html _site/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
